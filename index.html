<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapCut Web Studio - Professional Video Editor</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --accent-color: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #b0bec5;
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Navigation Bar */
        header {
            height: 55px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 10px; }
        .top-menu { display: flex; gap: 15px; font-size: 14px; color: var(--text-muted); }
        .top-menu span { cursor: pointer; padding: 5px 10px; border-radius: 4px; transition: 0.2s; }
        .top-menu span:hover { background: var(--bg-secondary); color: var(--text-main); }
        .export-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .export-btn:hover { opacity: 0.9; }

        /* Main Workspace Layout */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 1fr 220px;
            height: calc(100vh - 55px);
        }

        /* Sidebar Tools Panel */
        .sidebar {
            grid-row: 1 / 2;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        .sidebar-tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            text-align: center;
            font-size: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); background: var(--bg-panel); }
        .sidebar-content { padding: 15px; overflow-y: auto; flex: 1; }
        .tool-group h4 { font-size: 13px; margin-bottom: 10px; color: var(--text-muted); }
        .media-dropzone {
            border: 2px dashed var(--border-color);
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .media-dropzone:hover { border-color: var(--accent-color); }

        /* Preview / Player Section */
        .preview-area {
            grid-row: 1 / 2;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        video {
            max-width: 100%;
            max-height: calc(100% - 60px);
            background: #111;
        }
        .player-controls {
            position: absolute;
            bottom: 10px;
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
        }
        .player-controls button { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; }

        /* Properties / Settings Panel */
        .properties-panel {
            grid-row: 1 / 2;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            padding: 15px;
            overflow-y: auto;
        }
        .prop-section { margin-bottom: 20px; }
        .prop-section h3 { font-size: 13px; margin-bottom: 10px; color: var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .prop-control { margin-bottom: 10px; }
        .prop-control label { font-size: 11px; display: block; margin-bottom: 4px; color: var(--text-muted); }
        .prop-control select, .prop-control input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px;
            border-radius: 4px;
        }

        /* Timeline Section */
        .timeline-area {
            grid-column: 1 / 4;
            grid-row: 2 / 3;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        .timeline-toolbar {
            height: 35px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .timeline-toolbar button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; }
        .timeline-toolbar button:hover { color: #fff; }
        .timeline-tracks {
            flex: 1;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .track {
            height: 45px;
            background: var(--bg-secondary);
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            position: relative;
            border: 1px dashed var(--border-color);
        }
        .clip-item {
            height: 35px;
            background: #00838f;
            border-radius: 4px;
            position: absolute;
            left: 10px;
            width: 200px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
            color: #fff;
            cursor: grab;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <header>
        <div class="logo">
            <span>⚡ CapCut Studio Pro</span>
        </div>
        <div class="top-menu">
            <span>Media</span>
            <span>Audio</span>
            <span>Text</span>
            <span>Effects</span>
            <span>Transition</span>
            <span>Templates</span>
        </div>
        <button class="export-btn" onclick="exportVideo()">Export</button>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
        
        <!-- Sidebar Tools -->
        <div class="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active">Media</button>
                <button class="tab-btn">Audio</button>
                <button class="tab-btn">Text</button>
                <button class="tab-btn">Effects</button>
            </div>
            <div class="sidebar-content">
                <div class="tool-group">
                    <h4>Import Media</h4>
                    <div class="media-dropzone" onclick="document.getElementById('fileInput').click()">
                        <p style="font-size: 12px; color: var(--text-muted);">Click to upload video/photos</p>
                        <input type="file" id="fileInput" style="display:none" accept="video/*,image/*" onchange="loadMedia(event)">
                    </div>
                </div>
                <div class="tool-group">
                    <h4>Presets & Stock</h4>
                    <p style="font-size: 11px; color: var(--text-muted);">AI Auto-Captions, Body Effects, Chroma Key available.</p>
                </div>
            </div>
        </div>

        <!-- Video Preview Player -->
        <div class="preview-area">
            <video id="videoPlayer" controls></video>
            <div class="player-controls">
                <button onclick="document.getElementById('videoPlayer').play()">▶</button>
                <button onclick="document.getElementById('videoPlayer').pause()">⏸</button>
                <button onclick="document.getElementById('videoPlayer').currentTime=0()">⏮</button>
            </div>
        </div>

        <!-- Properties & Settings Panel -->
        <div class="properties-panel">
            <div class="prop-section">
                <h3>Video Settings</h3>
                <div class="prop-control">
                    <label>Aspect Ratio</label>
                    <select>
                        <option>9:16 (TikTok / Reels)</option>
                        <option>16:9 (YouTube)</option>
                        <option>1:1 (Instagram)</option>
                    </select>
                </div>
                <div class="prop-control">
                    <label>Speed Ramping</label>
                    <input type="range" min="0.2" max="5" step="0.1" value="1">
                </div>
            </div>
            <div class="prop-section">
                <h3>Audio & AI Adjustments</h3>
                <div class="prop-control">
                    <label>Volume Level</label>
                    <input type="range" min="0" max="100" value="100">
                </div>
                <div class="prop-control">
                    <label>Noise Reduction</label>
                    <input type="checkbox"> Enabled
                </div>
            </div>
        </div>

        <!-- Timeline Area -->
        <div class="timeline-area">
            <div class="timeline-toolbar">
                <button>✂ Split</button>
                <button>🗑 Delete</button>
                <button>⏱ Speed</button>
                <button>🔄 Reverse</button>
            </div>
            <div class="timeline-tracks">
                <div class="track">
                    <span style="font-size: 10px; color: var(--text-muted); position: absolute; right: 10px;">Video Track 1</span>
                    <div class="clip-item" id="timelineClip">No media loaded</div>
                </div>
                <div class="track">
                    <span style="font-size: 10px; color: var(--text-muted); position: absolute; right: 10px;">Audio Track 2</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        function loadMedia(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.src = url;
                document.getElementById('timelineClip').innerText = file.name;
            }
        }

        function exportVideo() {
            alert('Exporting video sequence... Rendering 1080p / 4K stream.');
        }
    </script>
</body>
</html>
